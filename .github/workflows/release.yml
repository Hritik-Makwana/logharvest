name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write          # create the release
  id-token: write          # build provenance attestation
  attestations: write

jobs:
  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - name: Run the tests again on the exact tagged commit
        run: uv run pytest -q
      - name: Build a single-file executable (runs on machines without Python)
        run: uv run --with pyinstaller pyinstaller --onefile --name logharvest-${{ runner.os }} --collect-data logharvest entry.py
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ runner.os }}
          path: dist/logharvest-*

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
            - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAG=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && FLAG="--prerelease"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes $FLAG
          fi
