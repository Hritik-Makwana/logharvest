[project]
name = "logharvest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
full = ["psutil"]
ios = ["pymobiledevice3"]
[project.scripts]
logharvest = "logharvest.cli:main"
[dependency-groups]
dev = ["pytest", "ruff"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["logharvest"]
[tool.setuptools.package-data]
logharvest = ["index.html"]
[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E9", "F"]
