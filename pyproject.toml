[project]
name = "logharvest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
[project.optional-dependencies]
full = ["psutil"]
[project.scripts]
logharvest = "logharvest.cli:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.package-data]
logharvest = ["index.html"]
