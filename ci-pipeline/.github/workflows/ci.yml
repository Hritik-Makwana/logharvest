name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false            # see every OS failure, not just the first
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev      # needs uv.lock committed: run `uv lock` once
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    name: build + smoke-test wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the built wheel into a clean venv and run it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/logharvest --help
          /tmp/smoke/bin/python -c "import importlib.resources as r; assert r.files('logharvest').joinpath('index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
